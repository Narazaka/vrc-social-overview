name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # タグと package.json の version がずれたまま出さない
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm zip
      - run: pnpm zip:firefox

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes .output/*.zip
        env:
          GH_TOKEN: ${{ github.token }}

      # Chrome ウェブストアへ新しい版をアップロードして審査に出す（審査に通れば公開される）
      - run: pnpm wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_API_VERSION: v2
          CHROME_SKIP_SUBMIT_REVIEW: 'false'
          CHROME_CANCEL_PENDING: 'false'
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
